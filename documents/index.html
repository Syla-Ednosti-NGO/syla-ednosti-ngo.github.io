<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документи та протоколи — ГО «Об’єднані. Сильні. Разом!»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/documents.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <a class="brand-mark" href="../">ОБ’ЄДНАНІ.&nbsp;СИЛЬНІ.&nbsp;РАЗОМ!</a>
    <span class="app-sub">документи та протоколи</span>
  </div>
</header>

<main class="doc-shell">
  <h1 style="margin-top:8px;">Документи та протоколи</h1>
  <p class="page-hint">Документи організації. Натисніть, щоб відкрити PDF.</p>

  <div id="loading" class="loading-screen">
    <span class="spinner"></span>
    <span>Завантаження…</span>
  </div>

  <div id="list"></div>

  <div id="empty" class="empty-state hidden">
    <div class="empty-state-icon">📂</div>
    <p>Поки немає опублікованих документів.</p>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  const WORKER = (window.DOCS_CONFIG && window.DOCS_CONFIG.WORKER_URL || '').replace(/\/+$/, '');
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function fmt(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
  }

  function fileHref(id) { return `${WORKER}/api/public/documents/${encodeURIComponent(id)}/file`; }

  function progressText(d) {
    const n = d.signedCount || 0;
    if (d.mode === 'fixed' && d.requiredCount) return `${n} / ${d.requiredCount} підписів`;
    return `${n} підписів · збір триває`;
  }

  function card(d, icon, cta, meta) {
    return `
      <a class="doc-card" style="display:flex;align-items:center;gap:14px;text-decoration:none;"
         href="${fileHref(d.id)}" target="_blank" rel="noopener">
        <span style="font-size:30px;">${icon}</span>
        <span style="flex:1;">
          <span class="doc-card-title" style="display:block;">${esc(d.title)}</span>
          <span class="doc-card-meta">${esc(meta)}</span>
        </span>
        <span class="tile-cta">${cta}</span>
      </a>`;
  }

  function sectionHtml(title, count, cardsHtml) {
    return `
      <section class="doc-group">
        <div class="doc-group-head"><span class="doc-group-title">${esc(title)}</span><span class="doc-group-count">${count}</span></div>
        <div class="doc-group-body">${cardsHtml}</div>
      </section>`;
  }

  async function load() {
    try {
      const res = await fetch(`${WORKER}/api/public/documents`);
      const data = await res.json();
      const docs = data.documents || [];
      $('#loading').classList.add('hidden');
      if (!docs.length) { $('#empty').classList.remove('hidden'); return; }

      const signing = docs.filter((d) => d.status !== 'signed');
      const archive = docs.filter((d) => d.status === 'signed');

      let html = '';
      if (signing.length) {
        html += sectionHtml('Зараз на підписанні', signing.length,
          signing.map((d) => card(d, '📝', 'Відкрити PDF →', progressText(d))).join(''));
      }
      if (archive.length) {
        html += sectionHtml('Опубліковані документи', archive.length,
          archive.map((d) => card(d, '📄', 'Відкрити →',
            `${d.closedAt ? 'підписано ' + fmt(d.closedAt) : ''}${d.signedCount ? ' · ' + d.signedCount + ' підписів' : ''}`)).join(''));
      }
      $('#list').innerHTML = html;
    } catch (e) {
      $('#loading').classList.add('hidden');
      $('#list').innerHTML = `<div class="banner banner-error"><span class="banner-icon">!</span><div>Не вдалося завантажити список документів.</div></div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
